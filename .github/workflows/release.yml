name: Release
# Runs when a tag vX.Y.Z is pushed. Checks the tag against the version and the
# changelog, runs the tests, builds the archives and publishes the GitHub
# release. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff aiohttp pytest-aiohttp
      - run: ruff check src tests tools tools/devhost tools/webdemo
      - run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag and extract the release notes
        run: python tools/release_check.py "$GITHUB_REF_NAME" > notes.md
      - name: Build the source archive and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "emuctl ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
