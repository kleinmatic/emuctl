name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # aiohttp is for the web part only; on 3.10 its tests skip themselves.
      - run: python -m pip install pytest pytest-cov ruff aiohttp pytest-aiohttp
      - run: ruff check src tests tools tools/devhost tools/webdemo
      - run: python -m pytest -q --cov=emuctl --cov-report=json --cov-report=term
      # The web daemon needs 3.11, so 3.10 cannot cover it.
      - if: matrix.python != '3.10'
        run: python tools/coverage_check.py coverage.json

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest aiohttp pytest-playwright
      - run: python -m playwright install --with-deps chromium
      - run: EMUCTL_BROWSER=1 python -m pytest -q tests/browser
