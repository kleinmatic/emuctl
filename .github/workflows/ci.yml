name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov ruff
      - run: ruff check src tests tools tools/devhost
      - run: python -m pytest -q --cov=emuctl --cov-report=json --cov-report=term
      - run: python tools/coverage_check.py coverage.json
