# A SIMH VAX whose ini ends in `boot`, with the console on telnet port 2001
# (`set console telnet=2001` in vax.ini).
name     = vax
os       = NetBSD/vax
emulator = open-simh
workdir  = /srv/emu/vax
command  = /usr/local/bin/vax vax.ini
disks    = ra0.dsk
serials  = 2001
broker   = 2301

ready    = login:
halted   = >>>
