# An MS-DOS guest on 86Box, drawn on its own Xvnc server.
# See docs/emulators/86box.md. Paths and the password file are invented.
name = dos
os = MS-DOS 6.22
emulator = 86Box 6.0
workdir = /srv/emu/dos
console = none

# Xvnc first; 86Box starts once display :1 accepts connections.
display_command = /usr/bin/Xvnc :1 -geometry 720x560 -depth 24 -rfbport 5901 -rfbauth /srv/emu/dos/vnc.passwd -SecurityTypes VncAuth -localhost -AlwaysShared
display_wait = /tmp/.X11-unix/X1

env = DISPLAY=:1 QT_QPA_PLATFORM=xcb ALSOFT_DRIVERS=null SDL_AUDIODRIVER=dummy
command = /usr/bin/86Box -P /srv/emu/dos -R /usr/share/86Box/roms -N -V DOS
disks = hdd.img

# 86Box ignores SIGTERM. For DOS at a prompt, quitting at once is harmless.
stop_signal = HUP
ready_after = 10

# The web page's Display tab, through Xvnc.
display = vnc://127.0.0.1:5901
display_password_file = /etc/emuctl/display/dos.pass
