# OpenVMS Alpha on es40. serial0/serial1 in es40.cfg are on ports 21000/21001.
name     = alpha
os       = OpenVMS Alpha 8.4
emulator = es40
workdir  = /srv/emu/alpha
command  = /usr/local/bin/es40 es40.cfg
disks    = dka0.img
serials  = 21000,21001
broker   = 2300

boot.1   = >>> | boot dka0
ready    = Username:
halted   = P00>>>
boot_timeout = 1200

stuck.1  = Please enter date and time
stuck.2  = waiting to form or join

# Shutting VMS down needs a login. The script reads its credential from the
# service's environment file, never from this conf.
# stop_command = /usr/local/libexec/vms-shutdown
# stop_timeout = 420

guest_addr = 192.0.2.10
guest_port = 23
