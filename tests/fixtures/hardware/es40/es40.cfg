// Invented ES40 for tests. Not a real machine.
# also a comment
sys0 = tsunami
{
  memory.bits = 30;
  rom.srm = "rom/cl67srmrom.exe";
  cpu0 = ev68cb { speed = 800M; icache = true; idle_nap = true; }
  serial0 = serial { address = "127.0.0.1"; port = 21900; }
  serial1 = serial { address = "127.0.0.1"; port = 21901; raw_mode = true; }
  pci0.15 = ali_ide
  {
    disk0.0 = file { file = "dka0.img"; read_only = false; cdrom = false; autocreate_size = 9G; }
    disk1.0 = file { file = "install.iso"; read_only = true; cdrom = true; }
  }
  pci0.4 = dec21143 { type = "tap"; adapter = "tap9"; mac = "02-00-00-00-00-03"; queue = 8192; }
}
