; Invented MicroVAX 3900 for tests. Not a real machine.
set cpu 64m
set cpu conhalt
set cpu idle=ultrix
set rq0 ra73
attach rq0 root.dsk
SET RQ1 RA92,FORMAT=VHD
ATT RQ1 usr.dsk
set rq2 cdrom
attach -r rq2 install.iso
set rl disable
set dz lines=8
attach dz 2005 nobuffer
set console telnet=2001
attach nvr test.nvr
set xq type=delqa
set xq mac=02-00-00-00-00-01
attach xq tap:tap9
set tq enable
att -f tq0 ansi-vms tape.tap
# comment
boot cpu
