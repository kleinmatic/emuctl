[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emuctl"
version = "0.1.0"
description = "Run emulated machines (SIMH, es40, QEMU and others) as services: console broker, boot driving, guest state"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
keywords = ["emulator", "simh", "es40", "qemu", "retrocomputing", "console"]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
emuctl = "emuctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
