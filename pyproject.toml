[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emuctl"
dynamic = ["version"]
description = "Run emulated machines (SIMH, es40, QEMU and others) as services: console broker, boot driving, guest state"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
keywords = ["emulator", "simh", "es40", "qemu", "retrocomputing", "console"]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov",
        "aiohttp>=3.9; python_version >= '3.11'",
        "pytest-aiohttp; python_version >= '3.11'"]
web = ["aiohttp>=3.9"]
release = ["build"]

[project.scripts]
emuctl = "emuctl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "emuctl.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emuctl.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
# For the web tests (pytest-aiohttp). Harmless warnings where it is not installed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
