<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emuctl · log in</title>
<link rel="stylesheet" href="/static/css/app.css">
<script type="module" src="/static/js/login.js"></script>
</head>
<body>
<main class="login">
  <div class="card">
    <h1>emuctl</h1>
    <div class="muted">Log in to manage this host's guests.</div>
    <form id="login" autocomplete="on">
      <label>User name <input name="user" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Log in</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>
</main>
</body>
</html>
